<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - 复古街机</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f2a;
            --grid-color: #1a1a3a;
            --neon-green: #00ff88;
            --neon-green-dim: #00cc66;
            --neon-green-dark: #006633;
            --food-color: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #aaaacc;
            --glow-green: 0 0 20px #00ff88, 0 0 40px #00ff8866;
            --glow-food: 0 0 15px #ff6b6b, 0 0 30px #ff6b6b66;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at top, #1a1a4a 0%, transparent 50%),
                radial-gradient(ellipse at bottom, #0a1a2a 0%, transparent 50%);
            font-family: 'VT323', monospace;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--neon-green);
            text-shadow: var(--glow-green);
            text-align: center;
            letter-spacing: 4px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% {
                text-shadow: var(--glow-green);
            }
            50% {
                text-shadow: 0 0 30px #00ff88, 0 0 60px #00ff88, 0 0 90px #00ff8844;
            }
        }

        .score-panel {
            display: flex;
            gap: 40px;
            font-size: 1.8rem;
            font-family: 'VT323', monospace;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .score-label {
            font-size: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-value {
            font-size: 2.5rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        .game-wrapper {
            position: relative;
            padding: 4px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-green-dim), var(--neon-green-dark));
            border-radius: 8px;
            box-shadow: var(--glow-green);
        }

        .game-board {
            background: var(--bg-secondary);
            border-radius: 4px;
            position: relative;
        }

        #gameCanvas {
            display: block;
            border-radius: 4px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            border-radius: 4px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--neon-green);
            text-shadow: var(--glow-green);
            text-align: center;
        }

        .overlay-text {
            font-size: 1.5rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            padding: 15px 30px;
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: var(--neon-green);
            color: var(--bg-primary);
            box-shadow: var(--glow-green);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            border-color: var(--neon-green);
            animation: btnGlow 1.5s ease-in-out infinite;
        }

        @keyframes btnGlow {
            0%, 100% {
                box-shadow: 0 0 5px var(--neon-green);
            }
            50% {
                box-shadow: 0 0 20px var(--neon-green), 0 0 40px var(--neon-green-dim);
            }
        }

        .instructions {
            margin-top: 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .key {
            display: inline-block;
            padding: 4px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--neon-green-dark);
            border-radius: 4px;
            margin: 0 4px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            color: var(--neon-green);
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 8px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
            }
        }

        .mobile-btn {
            background: var(--bg-secondary);
            border: 2px solid var(--neon-green-dark);
            color: var(--neon-green);
            font-size: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-btn:active {
            background: var(--neon-green);
            color: var(--bg-primary);
        }

        .mobile-btn.up { grid-column: 2; grid-row: 1; }
        .mobile-btn.left { grid-column: 1; grid-row: 2; }
        .mobile-btn.right { grid-column: 3; grid-row: 2; }
        .mobile-btn.down { grid-column: 2; grid-row: 3; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes foodPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .footer {
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 1rem;
            opacity: 0.6;
        }

        .high-score-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: #ffcc00;
            text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffcc00;
            animation: newHighScore 1s ease-in-out infinite;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes newHighScore {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .new-high-score {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">贪吃蛇</h1>
        
        <div class="score-panel">
            <div class="score-item">
                <span class="score-label">分数</span>
                <span class="score-value" id="currentScore">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">最高分</span>
                <span class="score-value" id="highScore">0</span>
            </div>
        </div>

        <div class="game-wrapper" id="gameWrapper">
            <div class="game-board">
                <canvas id="gameCanvas"></canvas>
                <div class="overlay" id="overlay">
                    <div class="overlay-title" id="overlayTitle">贪吃蛇</div>
                    <div class="overlay-text" id="overlayText">准备好挑战了吗？</div>
                    <button class="btn btn-start" id="startBtn">开始游戏</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="pauseBtn">暂停</button>
            <button class="btn" id="restartBtn">重新开始</button>
        </div>

        <div class="mobile-controls">
            <button class="mobile-btn up" data-direction="UP">▲</button>
            <button class="mobile-btn left" data-direction="LEFT">◀</button>
            <button class="mobile-btn right" data-direction="RIGHT">▶</button>
            <button class="mobile-btn down" data-direction="DOWN">▼</button>
        </div>

        <div class="instructions">
            <p>使用 <span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 或 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 控制方向</p>
            <p><span class="key">空格</span> 暂停游戏 | <span class="key">R</span> 重新开始</p>
        </div>

        <div class="footer">复古街机版本 v1.0</div>
    </div>

    <script>
        const GRID_SIZE = 20;
        const CELL_SIZE = 25;
        const INITIAL_SPEED = 150;
        const SPEED_INCREMENT = 5;
        const MIN_SPEED = 50;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const currentScoreEl = document.getElementById('currentScore');
        const highScoreEl = document.getElementById('highScore');
        const gameWrapper = document.getElementById('gameWrapper');

        canvas.width = GRID_SIZE * CELL_SIZE;
        canvas.height = GRID_SIZE * CELL_SIZE;

        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameStatus = 'IDLE';
        let speed = INITIAL_SPEED;
        let gameLoop = null;
        let foodAnimationFrame = 0;

        highScoreEl.textContent = highScore;

        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            speed = INITIAL_SPEED;
            currentScoreEl.textContent = score;
            generateFood();
            draw();
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            food = newFood;
        }

        function draw() {
            ctx.fillStyle = '#0f0f2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            drawFood();
            drawSnake();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(26, 26, 58, 0.5)';
            ctx.lineWidth = 0.5;

            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        function drawFood() {
            foodAnimationFrame += 0.1;
            const pulse = Math.sin(foodAnimationFrame) * 0.2 + 0.8;
            const centerX = food.x * CELL_SIZE + CELL_SIZE / 2;
            const centerY = food.y * CELL_SIZE + CELL_SIZE / 2;
            const radius = (CELL_SIZE / 2 - 3) * pulse;

            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius * 2);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#ff6b6b88');
            gradient.addColorStop(1, 'transparent');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 15 * pulse;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                const padding = 2;

                if (index === 0) {
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(x + padding, y + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2);
                    
                    ctx.fillStyle = '#0a0a1a';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    if (direction === 'RIGHT') {
                        ctx.fillRect(x + CELL_SIZE - eyeOffset - eyeSize, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - eyeOffset - eyeSize, y + CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction === 'LEFT') {
                        ctx.fillRect(x + eyeOffset, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + eyeOffset, y + CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction === 'UP') {
                        ctx.fillRect(x + eyeOffset, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - eyeOffset - eyeSize, y + eyeOffset, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(x + eyeOffset, y + CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - eyeOffset - eyeSize, y + CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    }
                    ctx.shadowBlur = 0;
                } else {
                    const colorProgress = index / snake.length;
                    const r = Math.floor(0 + colorProgress * 0);
                    const g = Math.floor(204 - colorProgress * 102);
                    const b = Math.floor(102 - colorProgress * 51);
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.shadowColor = `rgb(${r}, ${g}, ${b})`;
                    ctx.shadowBlur = 5;
                    ctx.fillRect(x + padding, y + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2);
                    ctx.shadowBlur = 0;
                }
            });
        }

        function moveSnake() {
            direction = nextDirection;
            const head = { ...snake[0] };

            switch (direction) {
                case 'UP': head.y--; break;
                case 'DOWN': head.y++; break;
                case 'LEFT': head.x--; break;
                case 'RIGHT': head.x++; break;
            }

            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.textContent = score;
                
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                    gameWrapper.classList.add('new-high-score');
                }

                speed = Math.max(MIN_SPEED, speed - SPEED_INCREMENT);
                generateFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameStatus = 'GAME_OVER';
            clearInterval(gameLoop);
            
            gameWrapper.classList.add('shake');
            setTimeout(() => gameWrapper.classList.remove('shake'), 500);

            overlayTitle.textContent = '游戏结束';
            overlayText.textContent = `最终得分: ${score}`;
            startBtn.textContent = '再来一次';
            overlay.classList.remove('hidden');
            pauseBtn.textContent = '暂停';
        }

        function startGame() {
            if (gameStatus === 'IDLE' || gameStatus === 'GAME_OVER') {
                initGame();
                gameStatus = 'RUNNING';
                overlay.classList.add('hidden');
                gameWrapper.classList.remove('new-high-score');
                
                if (gameLoop) clearInterval(gameLoop);
                gameLoop = setInterval(() => {
                    if (gameStatus === 'RUNNING') {
                        moveSnake();
                        draw();
                    }
                }, speed);
            }
        }

        function pauseGame() {
            if (gameStatus === 'RUNNING') {
                gameStatus = 'PAUSED';
                clearInterval(gameLoop);
                pauseBtn.textContent = '继续';
                overlayTitle.textContent = '游戏暂停';
                overlayText.textContent = '休息一下';
                startBtn.textContent = '继续游戏';
                overlay.classList.remove('hidden');
            } else if (gameStatus === 'PAUSED') {
                gameStatus = 'RUNNING';
                overlay.classList.add('hidden');
                pauseBtn.textContent = '暂停';
                
                if (gameLoop) clearInterval(gameLoop);
                gameLoop = setInterval(() => {
                    if (gameStatus === 'RUNNING') {
                        moveSnake();
                        draw();
                    }
                }, speed);
            }
        }

        function handleKeyPress(e) {
            const key = e.key.toLowerCase();

            if (['arrowup', 'w'].includes(key) && direction !== 'DOWN') {
                nextDirection = 'UP';
            } else if (['arrowdown', 's'].includes(key) && direction !== 'UP') {
                nextDirection = 'DOWN';
            } else if (['arrowleft', 'a'].includes(key) && direction !== 'RIGHT') {
                nextDirection = 'LEFT';
            } else if (['arrowright', 'd'].includes(key) && direction !== 'LEFT') {
                nextDirection = 'RIGHT';
            } else if (key === ' ') {
                e.preventDefault();
                if (gameStatus === 'IDLE' || gameStatus === 'GAME_OVER') {
                    startGame();
                } else {
                    pauseGame();
                }
            } else if (key === 'r') {
                initGame();
                if (gameStatus !== 'RUNNING') {
                    startGame();
                }
            }
        }

        document.querySelectorAll('.mobile-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const dir = btn.dataset.direction;
                if (dir === 'UP' && direction !== 'DOWN') {
                    nextDirection = 'UP';
                } else if (dir === 'DOWN' && direction !== 'UP') {
                    nextDirection = 'DOWN';
                } else if (dir === 'LEFT' && direction !== 'RIGHT') {
                    nextDirection = 'LEFT';
                } else if (dir === 'RIGHT' && direction !== 'LEFT') {
                    nextDirection = 'RIGHT';
                }
            });
        });

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        restartBtn.addEventListener('click', () => {
            initGame();
            startGame();
        });
        document.addEventListener('keydown', handleKeyPress);

        initGame();
        draw();

        function animateIdle() {
            if (gameStatus === 'IDLE') {
                foodAnimationFrame += 0.05;
                draw();
            }
            requestAnimationFrame(animateIdle);
        }
        animateIdle();
    </script>
</body>
</html>
